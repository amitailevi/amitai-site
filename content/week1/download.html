<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>תיק תוכן — V6 אדום+כחול | אמיתי לוי</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;700;900&display=swap" rel="stylesheet">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-4VY1G75TQE"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','G-4VY1G75TQE');</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Heebo',sans-serif;background:#0a1628;color:#fff;min-height:100vh}
.top{text-align:center;padding:40px 20px 10px}
.top h1{font-size:32px;font-weight:900;color:#fff}
.top p{font-size:15px;color:#8899bb;margin-top:8px}
.top .sub{display:inline-block;margin-top:12px;background:linear-gradient(135deg,#c41e3a,#1a3a7a);padding:6px 18px;border-radius:20px;font-size:13px;color:#fff;font-weight:700}
.back{display:inline-block;margin-top:12px;color:#c41e3a;text-decoration:none;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;padding:20px;max-width:1100px;margin:0 auto}
.c{background:#111d33;border-radius:14px;overflow:hidden;border:1px solid #1a2a44;transition:transform .2s}
.c:hover{transform:translateY(-4px)}
.c img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block}
.c-body{padding:14px 18px}
.c-body h3{font-size:17px;font-weight:700;color:#fff;margin-bottom:5px}
.c-body p{font-size:13px;color:#8899bb;line-height:1.5}
.c a.dl{display:block;padding:13px;background:linear-gradient(135deg,#c41e3a,#1a3a7a);color:#fff;font-weight:700;font-size:15px;text-decoration:none;text-align:center;transition:opacity .2s}
.c a.dl:hover{opacity:.85}
.divider{max-width:800px;margin:40px auto 10px;border-top:1px solid #1a2a44;padding-top:10px}
.caps{max-width:800px;margin:0 auto 40px;padding:0 20px}
.caps h2{font-size:24px;font-weight:900;color:#fff;text-align:center;margin-bottom:24px}
.cap{background:#111d33;border-radius:12px;padding:20px;margin-bottom:14px;border-right:3px solid #c41e3a}
.cap h4{color:#c41e3a;font-size:14px;margin-bottom:10px;font-weight:700}
.cap pre{white-space:pre-wrap;font-family:'Heebo',sans-serif;font-size:14px;color:#8899bb;line-height:1.7;direction:rtl}
.cap button{background:none;border:1px solid #c41e3a;color:#c41e3a;padding:6px 14px;border-radius:6px;cursor:pointer;font-family:'Heebo',sans-serif;font-size:12px;transition:all .2s;margin-top:12px}
.cap button:hover{background:#c41e3a;color:#fff}
.cap button.ok{background:#27ae60;border-color:#27ae60;color:#fff}
.tip{text-align:center;padding:30px 20px 50px;color:#556;font-size:13px;line-height:2}
.canva-links{text-align:center;margin:20px auto;max-width:800px}
.canva-links a{display:inline-block;margin:6px;padding:8px 16px;background:#1a3a7a;color:#fff;border-radius:8px;text-decoration:none;font-size:13px;transition:background .2s}
.canva-links a:hover{background:#c41e3a}
</style>
</head>
<body>
<div class="top">
  <h1>🇺🇸 תיק תוכן — 3 פוסטים</h1>
  <p>אדום + כחול | סגנון נשיאותי | עם התמונה שלך</p>
  <div class="sub">V6 — אדום+כחול כמו טראמפ</div><br>
  <a href="/" class="back">← חזרה לאתר</a>
</div>
<div class="grid" id="g"></div>
<div class="divider"></div>
<div class="canva-links">
  <h3 style="margin-bottom:12px">עריכה ב-Canva</h3>
  <a href="https://www.canva.com/d/xhjMiW6WeoS2U91" target="_blank">✏️ פוסט 01</a>
  <a href="https://www.canva.com/d/Na6-yZhCpl9F-JU" target="_blank">✏️ פוסט 02</a>
  <a href="https://www.canva.com/d/1lEWJx6lIeCXd-V" target="_blank">✏️ פוסט 03</a>
</div>
<div class="divider"></div>
<div class="caps">
  <h2>טקסטים להעתקה</h2>
  <div id="cp"></div>
</div>
<div class="tip">בנייד: לחיצה ארוכה על התמונה → שמור תמונה<br>במחשב: כפתור הורדה</div>
<script>
const P=[
{n:"01",f:"post-01.png",t:"מנהיגות עם חזון",c:`אם אין אני לי — מי לי.
הלל הזקן ידע.

גם אני.

4 ערים. 612 ילדים. עשור של מנהיגות.
לא ביקשתי. הם ראו תוצאות.

אמיתי לוי
מחנך · יזם · מנהיג
🌐 amitailevi.com`},
{n:"02",f:"post-02.png",t:"מנהיגות בחינוך",c:`4 ערים. 612 ילדים. עשור של מנהיגות.

לא חברת ענק.
לא רשת ממומנת.
יזם אחד עם חזון.

כשהמערכת אומרת ״אי אפשר״ —
אני אומר ״תראו אותי.״

אמיתי לוי
🌐 amitailevi.com`},
{n:"03",f:"post-03.png",t:"מותג אישי",c:`אמרו שזה בלתי אפשרי.
עשיתי.

מחנך. יזם. מנהיג.
מאוסטרליה ועד באר טוביה —
בניתי מערכת חינוך שלמה.

אמיתי לוי
🌐 amitailevi.com`}
];
const g=document.getElementById('g'),cp=document.getElementById('cp');
P.forEach(p=>{
g.innerHTML+=`<div class="c"><img src="${p.f}" alt="${p.t}" loading="lazy"><div class="c-body"><h3>${p.n} — ${p.t}</h3><p>${p.c.split('\n')[0]}</p></div><a class="dl" href="${p.f}" download>${p.t} ⬇️</a></div>`;
cp.innerHTML+=`<div class="cap"><h4>${p.n} — ${p.t}</h4><pre>${p.c}</pre><button onclick="cc(this,'${p.n}')">העתק טקסט</button></div>`;
});
function cc(b,n){
navigator.clipboard.writeText(P.find(p=>p.n===n).c).then(()=>{
b.textContent='✓ הועתק';b.classList.add('ok');
setTimeout(()=>{b.textContent='העתק טקסט';b.classList.remove('ok')},2000);
})}
</script>
</body>
</html>
