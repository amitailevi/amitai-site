<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Academy Ops</title><style>body{margin:0;background:#f3f5f8;color:#17202d;font-family:Arial,sans-serif}.w{max-width:1100px;margin:auto;padding:30px}.top{display:flex;justify-content:space-between;align-items:center}.kpis,.groups{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:white;border:1px solid #e1e5eb;border-radius:16px;padding:20px;margin:12px 0}.kpi b{display:block;font-size:30px}.muted{color:#6d7685}.bar{height:9px;background:#edf0f4;border-radius:9px;overflow:hidden;margin-top:14px}.fill{height:100%;background:#b48a38}.tag{display:inline-block;padding:5px 9px;border-radius:99px;background:#eef6ef;color:#2f6d3a;font-weight:bold}.warn{background:#fff4dc;color:#8b5a00}@media(max-width:700px){.kpis,.groups{grid-template-columns:1fr}}</style></head><body><main class="w"><div class="top"><div><h1>CRYPTO × AI · Operations</h1><div class="muted">דשבורד דמו — נתוני המחשה בלבד</div></div><b>5 / 7 / 10</b></div><section class="kpis"><div class="card kpi"><span class="muted">תלמידים</span><b>42</b><span>יעד 6×7</span></div><div class="card kpi"><span class="muted">פוטנציאל גבייה</span><b>₪546K</b><span>בממוצע 7</span></div><div class="card kpi"><span class="muted">קיבולת מקסימלית</span><b>60</b><span>6×10</span></div></section><h2>מחזורים</h2><section class="groups" id="groups"></section></main><script>const data=[['BITCOIN','בוקר',7],['ETHEREUM','ערב',8],['SOLANA','בוקר',5],['XRP','ערב',4],['SATOSHI','בוקר',10],['WEB3 AI','ערב',8]];document.getElementById('groups').innerHTML=data.map(([n,t,c])=>{let s=c<5?'טרם נפתח':c===10?'SOLD OUT':'מאושר';let cls=c<5?'tag warn':'tag';return `<div class="card"><div class="${cls}">${s}</div><h3>${n} · ${t}</h3><b style="font-size:26px">${c}/10</b><div class="bar"><div class="fill" style="width:${c*10}%"></div></div><p class="muted">₪${(c*13000).toLocaleString('he-IL')} רשום</p></div>`}).join('')</script></body></html>
